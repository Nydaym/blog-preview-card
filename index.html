<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg">
    <div class="card">
      <img src="assets/images/illustration-article.svg" alt="Blog preview illustration" class="card-image">
      <div class="card-content">
        <div style="background-color: hsl(47, 88%, 63%); width: fit-content;" class="Category">
          <p>Learning</p>
        </div>
        <div style="border-bottom: 12px;" class="Published">
          <p>Published 21 Dec 2023</p>
        </div>
        <div style="border-bottom: 12px;" class="Title">
          <h1>HTML & CSS foundations</h1>
        </div>
        <div class="Description">
          <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
      </div>
      <div class="Author">
        <img src="assets\images\image-avatar.webp" alt="Author Image" class="userpic">
        <div class="authorname">Greg Hooper</div>
      </div>
    </div>
  </div>
</body>

</html>

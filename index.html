<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <style>
      @font-face {
        font-family: "Figtree";
        src: url("./assets/fonts/Figtree-VariableFont_wght.ttf") format("truetype");
        font-style: normal;
        font-weight: 500 800;
        font-display: swap;
      }

      :root {
        --yellow: hsl(47, 88%, 63%);
        --white: hsl(0, 0%, 100%);
        --gray-500: hsl(0, 0%, 42%);
        --gray-950: hsl(0, 0%, 7%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-color: var(--yellow);
        font-family: "Figtree", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--gray-950);
      }

      .card {
        width: min(100%, 24rem);
        background-color: var(--white);
        border: 1px solid var(--gray-950);
        border-radius: 1.25rem;
        padding: 1.5rem;
        box-shadow: 0.5rem 0.5rem 0 0 var(--gray-950);
      }

      .card__image {
        width: 100%;
        border-radius: 0.75rem;
        display: block;
      }

      .card__tag {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.3rem 0.75rem;
        border-radius: 0.25rem;
        background-color: var(--yellow);
        font-size: 0.875rem;
        font-weight: 800;
      }

      .card__date {
        margin: 0.875rem 0;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .card__title {
        margin: 0;
        font-size: clamp(1.25rem, 1.2rem + 0.25vw, 1.5rem);
        font-weight: 800;
      }

      .card__link {
        color: inherit;
        text-decoration: none;
      }

      .card__link:hover,
      .card__link:focus-visible {
        color: var(--yellow);
        outline: none;
      }

      .card__description {
        margin: 1rem 0 1.5rem;
        line-height: 1.5;
        color: var(--gray-500);
      }

      .card__author {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .card__avatar {
        width: 2rem;
        height: 2rem;
      }

      .card__name {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 800;
      }

      .attribution {
        position: fixed;
        inset-inline: 0;
        bottom: 0.5rem;
        text-align: center;
        font-size: 0.6875rem;
      }

      .attribution a {
        color: var(--gray-950);
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card" aria-labelledby="post-title">
        <img
          class="card__image"
          src="./assets/images/illustration-article.svg"
          alt="Colorful abstract illustration"
          width="336"
          height="201"
        />
        <span class="card__tag">Learning</span>
        <p class="card__date">Published 21 Dec 2023</p>
        <h1 id="post-title" class="card__title">
          <a class="card__link" href="#">HTML &amp; CSS foundations</a>
        </h1>
        <p class="card__description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="card__author">
          <img
            class="card__avatar"
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper"
            width="32"
            height="32"
          />
          <p class="card__name">Greg Hooper</p>
        </div>
      </article>
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer noopener">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
